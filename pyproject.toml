[project]
name = "backend"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<=3.13"
dependencies = [
    "aiobotocore>=2.21.1",
    "argon2-cffi>=23.1.0",
    "aiohttp>=3.11.0",
    "alembic>=1.16.5",
    "croniter>=3.0.0",
    "dishka>=1.7.2",
    "granian>=2.5.0",
    "greenlet>=3.2.4",
    "litestar>=2.21.1",
    "msgspec>=0.19.0",
    "psycopg[binary,pool]>=3.2.10",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.43",
    "types-pyyaml>=6.0.12.20250915",
    "uuid-utils>=0.14.0",
    "uvicorn>=0.42.0",
    "types-croniter>=6.2.2.20260408",
    "redis>=7.4.0",
    "hiredis>=3.3.1",
    "fast-blurhash>=0.2.1",
    "Pillow>=11.2.1",
]

[dependency-groups]
dev = [
    "backend",
    "mypy>=1.18.1",
    "nox>=2025.5.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
    "testcontainers>=4.13.1",
]

[project.scripts]
backend = "backend.main.cli:main"

[tool.mypy]
files = ["backend/", "tests/"]
strict = true
strict_bytes = true
local_partial_types = true
ignore_missing_imports = true
install_types = true
non_interactive = true
extra_checks = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
disallow_any_unimported = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_unreachable = true
pretty = true
color_output = true
show_error_codes = true
show_error_context = true
python_version = "3.12"
exclude = "(\\.venv|\\.tox|build|dist)/"

[tool.ruff]
exclude = [".venv"]
fix = true
unsafe-fixes = true
line-length = 100

[tool.ruff.lint]
ignore = [
  "A002",         # builtin-argument-shadowing (A002)
  "T201",         # print (T201)
  "PLR0913",      # too-many-arguments (PLR0913)
  "B008",         # function-call-in-default-argument (B008)
  "COM819",       # prohibited-trailing-comma (COM819)
  "TRY003",       # raise-vanilla-args (TRY003)
  "EM102",        # f-string-in-exception (EM102)
  "D100",         # undocumented-public-module (D100)
  "D101",         # undocumented-public-class (D101)
  "D102",         # undocumented-public-method (D102)
  "D103",         # undocumented-public-function (D103)
  "D104",         # undocumented-public-package (D104)
  "D105",         # undocumented-magic-method (D105)
  "D107",         # undocumented-public-init (D107)
  "D415",         # missing-terminal-punctuation (D415)
  "D400",         # missing-trailing-period (D400)
  "S311",         # suspicious-non-cryptographic-random-usage (S311)
  "S105",         # hardcoded-password-string (S105)
  # Typing
  "ANN401",       # any-type (ANN401)
  # Incompatible
  "D203",         # incorrect-blank-line-before-class (D203)
  "D212",         # multi-line-summary-first-line (D212)
  "COM812",       # missing-trailing-comma (COM812)
]
unfixable = []
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",         # assert (S101)
  "S106",         # hardcoded-password-func-arg (S106)
]
"backend/entry/rest/common/middlewares/**" = [
  "S105",         # false positive on scope key names containing "token"
]
"backend/infra/external/http/sessions/**" = [
  "ASYNC109",     # timeout parameter in async functions (passed to aiohttp, not asyncio)
]
"backend/domain/entities/**" = [
  "TC002",        # SQLAlchemy needs type imports at runtime for Mapped[] resolution
  "TC003",
]


[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest.ini_options]
python_files = "tests/*.py"
console_output_style = "progress"
addopts = "-vs -rf --cov=src --no-cov-on-fail"
asyncio_mode = "auto"


[tool.coverage.run]
parallel = true
concurrency = ["thread", "greenlet"]
source = ["src", "tests"]
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = [
  '@(abc\.)?abstractmethod',
  "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["backend"]

[tool.uv.sources]
backend = { workspace = true }
